apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-crm-app
  namespace: store-crm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: store-crm-app
  template:
    metadata:
      labels:
        app: store-crm-app
    spec:
      containers:
        - name: store-crm-app
          image: lgs-store-crm:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15