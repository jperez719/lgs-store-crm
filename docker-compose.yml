services:
  store-postgres:
    image: postgres:16
    container_name: store-crm-postgres
    environment:
      POSTGRES_DB: store_crm_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - store_crm_pgdata:/var/lib/postgresql/data
    networks:
      - store-crm-shared
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d store_crm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: store-crm-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - store-crm-shared
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: lgs-store-crm:v3.1-tenant-endpoints
    container_name: store-crm-app
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      store-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - store-crm-shared

volumes:
  store_crm_pgdata:

networks:
  store-crm-shared:
    external: true